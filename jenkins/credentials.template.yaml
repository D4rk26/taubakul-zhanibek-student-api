# JCasC template for the GitHub credential of taubakul-zhanibek-student-api (Taubakul Zhanibek).
# The token is NOT stored here. It is inserted on the fly and the result is piped
# straight into Jenkins, so the token never touches the disk:
#
#   gh auth token | python3 -c 'import sys; t=sys.stdin.read().strip(); \
#     print(open("jenkins/credentials.template.yaml").read().replace("__GITHUB_TOKEN__", t))' \
#   | java -jar jenkins-cli.jar -s http://127.0.0.1:8080/ -auth @<api-token-file> apply-configuration
#
# Jenkins stores the credential encrypted in $JENKINS_HOME/credentials.xml.
# It is kept out of jenkins/casc.yaml on purpose: casc.yaml is re-applied on every
# start, and without the token available it would overwrite the password with "".
credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github-token"
              username: "D4rk26"
              password: "__GITHUB_TOKEN__"
              description: "GitHub token of D4rk26 (Taubakul Zhanibek) for checkout"
